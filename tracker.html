<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3A7A">
<title>יומן בריאות</title>
<link rel="manifest" href="tracker-manifest.json">
<link rel="icon" href="tracker-icon-192.png">
<link rel="apple-touch-icon" href="tracker-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF6EF; --card: #FFFFFF; --line: #E8DFD1; --line2: #F0E9DD; --chipline: #DDD3C4;
  --ink: #2A2230; --ink2: #4A4150; --muted: #6E6475; --accent: #5B3A7A; --accent-soft: #F3EDF7;
  --gold: #8F6B1E; --rose: #B03A62; --blue-soft: #EEF3FA;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Assistant', system-ui, sans-serif; font-size: 16px; }
body { min-height: 100vh; }
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
.serif { font-family: 'Frank Ruhl Libre', serif; }
#view { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + var(--safe-b)); }
h1 { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 26px; margin: 0; }
h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.lbl { font-size: 13px; color: var(--muted); margin: 12px 0 8px; }
.lbl:first-child { margin-top: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--chipline); background: #fff; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.dashed { border-style: dashed; border-color: #C9BBA6; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: #EFE8DC; }
.seg button { min-height: 36px; padding: 0 14px; border-radius: 9px; border: none; background: transparent; font-size: 14px; font-weight: 700; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(42,34,48,.15); }
.btn { min-height: 48px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; padding: 0 18px; }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--chipline); font-weight: 600; }
.btn.soft { background: var(--accent-soft); color: var(--accent); border: 1.5px dashed #B9A6C8; }
.btn.block { width: 100%; }
.iconbtn { width: 44px; height: 44px; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--accent); border-radius: 12px; }
.input { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--chipline); background: var(--bg); font-size: 16px; }
textarea.input { padding: 10px 14px; min-height: 0; resize: none; }
.scale { display: grid; gap: 6px; }
.scale button { min-height: 44px; border-radius: 10px; border: none; font-weight: 700; font-size: 15px; outline-offset: 2px; }
.scale button[aria-pressed="true"] { outline: 3px solid var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
.sw { width: 12px; height: 12px; border-radius: 4px; border: 1px solid rgba(42,34,48,.15); display: inline-block; flex: 0 0 auto; }
.tl-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line2); }
.tl-time { width: 46px; flex: 0 0 auto; font-size: 14px; font-weight: 700; color: var(--ink2); padding-top: 2px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px; }
.stat b { display: block; font-size: 16px; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: #F1ECE3; overflow: hidden; }
.bar > div { height: 8px; background: var(--gold); border-radius: 4px; }
/* calendar */
.cal-cell { position: relative; height: 50px; border-radius: 12px; border: 1px solid rgba(42,34,48,.08); font-size: 16px; font-weight: 600; padding: 0; background: #fff; }
.cal-cell.today { border: 2px solid var(--ink); font-weight: 800; }
.cal-cell.sel { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.cal-cell.empty { visibility: hidden; }
.cal-cell.future { opacity: .55; }
.cal-strip { position: absolute; top: 5px; left: 6px; right: 6px; height: 5px; display: flex; gap: 1px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.85); }
.cal-strip i { flex: 1 1 0; }
.cal-bleed { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 7px; height: 7px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 1.5px #fff; }
.cal-bleed.pred { background: transparent; border: 1.5px solid var(--rose); }
.layers { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
.layers::-webkit-scrollbar { display: none; }
.layers .chip { flex: 0 0 auto; }
/* tab bar */
#tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(8px + var(--safe-b)); z-index: 20; }
#tabs button { border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; font-size: 12px; font-weight: 600; color: var(--muted); }
#tabs button[aria-current="page"] { color: var(--accent); font-weight: 800; }
/* sheet */
#sheet { position: fixed; inset: 0; background: rgba(42,34,48,.35); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
#sheet.open { display: flex; }
#sheet .panel { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + var(--safe-b)); }
.fam-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin: 10px 0 6px; }
.bristol button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--chipline); background: #fff; text-align: right; font-size: 14px; font-weight: 600; }
.bristol button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.bristol .n { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: 0 0 auto; }
.toast { position: fixed; bottom: calc(84px + var(--safe-b)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: 'Assistant', sans-serif; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); }
.insight { padding: 12px 0; border-top: 1px solid var(--line2); }
.insight:first-of-type { border-top: none; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs" aria-label="ניווט ראשי">
  <button data-tab="cal" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>לוח שנה</button>
  <button data-tab="charts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 4-6"/></svg>גרפים</button>
  <button data-tab="insights"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>תובנות</button>
  <button data-tab="tools"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>כלים</button>
  <button data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>הגדרות</button>
</nav>
<div id="sheet" role="dialog" aria-modal="true"><div class="panel" id="sheetPanel"></div></div>
<script>
'use strict';
const APP_VERSION = '6.11';
/* =====================================================================
   יומן בריאות — core: constants, storage, dates, cycle, daily metrics
   All data lives in localStorage under keys prefixed "tracker." so it never
   collides with Workout Pro (same origin), whose log we only READ.
   ===================================================================== */

const KEY = 'tracker.data';
const WORKOUT_KEY = 'workoutLog'; // owned by Workout Pro — read only

const DARK = '#2A2230', WHITE = '#FFFFFF';

/* ---------- option lists (agreed together) ---------- */
const FAMS = [
  { id: 'anger',  name: 'כעס ועצבנות',   c: '#e34948', items: ['עצבנית', 'כועסת', 'מתוסכלת', 'חסרת סבלנות', 'עוקצנית'] },
  { id: 'stress', name: 'סטרס וחרדה',    c: '#eb6834', items: ['לחוצה', 'חרדה', 'מודאגת', 'מוצפת', 'חסרת מנוחה', 'שיתוק ניהולי'] },
  { id: 'sad',    name: 'עצב',           c: '#2a78d6', items: ['עצובה', 'בודדה', 'מאוכזבת', 'פגועה', 'רגישה / בוכייה'] },
  { id: 'low',    name: 'דכדוך וריקנות', c: '#6250d6', items: ['מדוכדכת', 'חסרת תקווה', 'ריקה / אדישה', 'חסרת מוטיבציה', 'מותשת רגשית'] },
  { id: 'self',   name: 'ביקורת עצמית',  c: '#a0522d', items: ['שנאה עצמית', 'אשמה'] },
  { id: 'calm',   name: 'רוגע',          c: '#e87ba4', items: ['רגועה', 'שלווה', 'מסופקת', 'בטוחה', 'אסירת תודה'] },
  { id: 'joy',    name: 'שמחה ואנרגיה',  c: '#eda100', items: ['שמחה', 'אופטימית', 'נלהבת', 'מרוכזת', 'מלאת מוטיבציה', 'גאה'] }
];
// legend / chart order chosen so neighbouring colours stay distinguishable (validated)
const FAM_LEGEND = ['anger', 'sad', 'stress', 'low', 'joy', 'calm', 'self'];
const famById = id => FAMS.find(f => f.id === id);
const famOfWord = w => FAMS.find(f => f.items.includes(w));

const MOOD_LABELS = ['קשה', 'לא משהו', 'בסדר', 'טוב', 'מצוין'];
const MOOD_DIV = ['#A8466C', '#D9A0B4', '#EDE3D2', '#A9C2E0', '#3F6FA8'];
const INTENSITY = ['קלה', 'בינונית', 'חזקה'];

const PAIN_AREAS = ['אגן', 'בטן תחתונה', 'צד ימין', 'צד שמאל', 'גב תחתון', 'גב עליון', 'ירכיים ורגליים', 'זרועות', 'פי הטבעת', 'ראש', 'מפרקים', 'כתפיים וצוואר', 'כל הגוף'];
const PAIN_TYPES = ['התכווצויות', 'שריר תפוס', 'דואב', 'עמום', 'חד', 'דוקר', 'צורב', 'לוחץ', 'מקרין', 'פועם'];
const PAIN_WHEN = ['מחזור', 'יציאות', 'הטלת שתן', 'אחרי אוכל', 'תנועה או אימון', 'יחסי מין', 'ישיבה ממושכת'];
const PAIN_HELP = ['משכך כאבים', 'חימום', 'מנוחה', 'מתיחות', 'מקלחת חמה', 'שום דבר'];
const PAIN_IMPACT = ['לא הפריע', 'הפריע קצת', 'נאלצתי לעצור את מה שעשיתי', 'כאב משתק – התקפלות, בכי, צעקות'];

const BELLY_SYMS = ['נפיחות', 'בטן קשה למגע', 'גזים', 'כאב בטן', 'התכווצויות בטן', 'עוויתות', 'דקירות', 'צרבת', 'בחילה', 'תחושת מלאות מהירה', 'דחיפות', 'תחושת ריקון חלקי'];
const BELLY_WHEN = ['אחרי אוכל', 'סטרס', 'מחזור', 'קפה', 'ארוחה גדולה', 'ארוחה מאוחרת'];
const BELLY_HELP = ['חימום', 'תה', 'הליכה', 'מנוחה', 'משכך כאבים או תרופה', 'שום דבר'];
const SEVERITY = ['קלה', 'בינונית', 'חזקה', 'קשה'];

const GEN_GROUPS = [
  ['ראש וקוגניציה', ['כאב ראש', 'מיגרנה', 'ערפל מוחי', 'קושי להתרכז', 'סחרחורת']],
  ['אנרגיה ושינה', ['עייפות קיצונית', 'נדודי שינה']],
  ['חום וגוף', ['חום', 'צמרמורות', 'גלי חום', 'דופק מהיר', 'כאבי שרירים כלליים']],
  ['צינון ונשימה', ['צינון', 'נזלת', 'גודש באף', 'כאב גרון', 'שיעול']],
  ['הורמונלי', ['רגישות בשדיים', 'אקנה']],
  ['עור ואלרגיה', ['גירוד', 'פריחה', 'סרפדת (חבורות מגרדות)', 'תגובה חזקה לעקיצה', 'עקיצה שלא עוברת', 'עיניים מגרדות / דומעות', 'התעטשויות']],
  ['תיאבון, שתן וריח', ['תיאבון מוגבר', 'תיאבון ירוד', 'תכיפות במתן שתן', 'רגישות לריחות']]
];

const BRISTOL = ['גושים קשים ונפרדים', 'נקניק עם גושים', 'נקניק עם סדקים', 'חלקה ורכה', 'חתיכות רכות', 'רכה ודייסתית', 'מימית'];
const BRISTOL_C = ['#7A3F1E', '#93522A', '#A86A3C', '#5B3A7A', '#B07D1A', '#C0603A', '#B23A48'];

const BLEED = ['אין', 'דם בניגוב', 'הכתמה', 'קל', 'בינוני', 'כבד'];
const CYCLE_EXTRAS = ['קרישי דם', 'כתמים בין מחזורים'];
const SLEEP_H = ['פחות מ-5', '5–6', '6–7', '7–8', '8+'];
const SLEEP_H_NUM = [4.5, 5.5, 6.5, 7.5, 8.5];
const SLEEP_Q = ['גרועה', 'בינונית', 'טובה', 'מצוינת'];
const DREAMS = ['לא זוכרת', 'חלומות', 'חלומות רעים'];

const SLOTS = ['כל היום', 'בוקר', 'צהריים', 'ערב', 'ביניים / נשנוש', 'לילה'];
const PREP = ['ביתי', 'קנוי', 'בחוץ / מסעדה'];
const CRAVES = ['מתוק', 'מלוח', 'שוקולד', 'פחמימות', 'רק אוכל יבש', 'רתיעה מאוכל', 'רתיעה מריחות של אוכל'];
const FOOD_CATS = [
  ['gluten', 'גלוטן / לחם'], ['carbs', 'פחמימות'], ['dairy', 'מוצרי חלב'], ['eggs', 'ביצים'], ['sugar', 'סוכר ומתוקים'],
  ['caffeine', 'קפאין'], ['fried', 'מטוגן'], ['oil', 'שמן / שומן'], ['protein', 'מועשר בחלבון'], ['legumes', 'קטניות'], ['soy', 'סויה'], ['onion', 'בצל ושום'],
  ['spicy', 'חריף'], ['alcohol', 'אלכוהול'], ['salty', 'חטיפים מלוחים'], ['veg', 'ירקות'],
  ['fruit', 'פירות'], ['processed', 'מזון מעובד']
];
const catName = id => (FOOD_CATS.find(c => c[0] === id) || [id, id])[1];

const SUPP_TIMES = ['בוקר', 'צהריים', 'ערב', 'לפני שינה'];
const FREQS = [['daily', 'כל יום'], ['alt', 'יום כן יום לא'], ['weekly', 'X פעמים בשבוע'], ['days', 'ימים קבועים']];
const DAY_LETTERS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

const KIND_C = { energy: '#B07D1A', mood: '#5B3A7A', pain: '#45215A', belly: '#A35A2E', stool: '#7A5A3A', other: '#3F6FA8' };

/* ---------- dates (local, YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000); // b - a
const todayS = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtLong = s => { const d = parseD(s); return 'יום ' + DAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' ב' + MONTHS[d.getMonth()]; };
const fmtShort = s => { const d = parseD(s); return d.getDate() + '.' + (d.getMonth() + 1); };
const weekStart = s => addDays(s, -parseD(s).getDay());

/* ---------- storage ---------- */
function defaultSupps() {
  const t = todayS();
  const mk = (id, name, dose, times) => ({ id, name, dose, times, freq: 'daily', n: 7, days: [], anchor: t, active: true });
  return [
    mk('nac', 'NAC', '', ['בוקר', 'ערב']),
    mk('d', 'ויטמין D', '2 טיפות (2000 יח׳)', ['בוקר']),
    mk('omega', 'אומגה 3 צמחי', '', ['בוקר']),
    mk('turmeric', 'כורכום', '', ['בוקר']),
    mk('c', 'ויטמין C', '', ['בוקר']),
    mk('iron', 'ברזל', '', ['בוקר']),
    mk('b12', 'B12', '', ['בוקר']),
    mk('mg', 'מגנזיום', '', ['בוקר']),
    mk('folic', 'חומצה פולית', '', ['בוקר'])
  ];
}
function freshData() { return { v: 1, days: {}, foodLib: {}, supps: defaultSupps(), settings: { cycleLen: 28 } }; }

let DATA;
function load() {
  try { DATA = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { DATA = null; }
  if (!DATA || !DATA.days) DATA = freshData();
  DATA.foodLib = DATA.foodLib || {};
  let migrated = false;
  // foods saved before the dictionary knew them: try again (only if never confirmed and still empty)
  if (typeof guessFoodCats === 'function') Object.keys(DATA.foodLib).forEach(n => { const f = DATA.foodLib[n]; if (!f.confirmed && !(f.cats || []).length) { const g = guessFoodCats(n).cats; if (g.length) { f.cats = g; migrated = true; } } });
  if (migrated) try { localStorage.setItem(KEY, JSON.stringify(DATA)); } catch (e) {}
  DATA.supps = DATA.supps || defaultSupps();
  DATA.settings = DATA.settings || { cycleLen: 28 };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DATA)); }

const AREA_HE = { glutes: 'ישבן', quads: 'ירך קדמית', back: 'גב', core: 'בטן וליבה', upper_body: 'פלג גוף עליון', chest: 'חזה', shoulders: 'כתפיים', arms: 'זרועות' };
let _workouts = null;
function workoutsByDate() {
  if (_workouts) return _workouts;
  _workouts = {};
  let log = [];
  try { log = JSON.parse(localStorage.getItem(WORKOUT_KEY) || '[]'); } catch (e) { log = []; }
  if (!Array.isArray(log)) log = [];
  log.forEach(w => {

    (_workouts[w.date] = _workouts[w.date] || []).push({

    });

}
function workoutMin(s) { return (workoutsByDate()[s] || []).reduce((a, w) => a + w.min, 0); }

/* ---------- cycle ---------- */
let _cycle = null;
function invalidate() { _cycle = null; _workouts = null; _metrics = {}; }
const isBleed = b => b === 'קל' || b === 'בינוני' || b === 'כבד';
function cycleInfo() {
  if (_cycle) return _cycle;
  const bleedDays = Object.keys(DATA.days).filter(s => isBleed(DATA.days[s].bleed)).sort();
  const starts = [];
  bleedDays.forEach((s, i) => { if (i === 0 || diffDays(bleedDays[i - 1], s) > 7) starts.push(s); });
  const gaps = [];
  for (let i = 1; i < starts.length; i++) { const g = diffDays(starts[i - 1], starts[i]); if (g >= 18 && g <= 50) gaps.push(g); }
  let len = DATA.settings.cycleLen || 28;
  if (gaps.length) { const g = gaps.slice(-6).sort((a, b) => a - b); len = g[Math.floor(g.length / 2)]; }
  const periodLens = starts.map(st => { let n = 0; while (isBleed(getDay(addDays(st, n)).bleed)) n++; return n; }).filter(n => n > 0);
  const plen = periodLens.length ? Math.round(periodLens.reduce((a, b) => a + b, 0) / periodLens.length) : 5;
  _cycle = { starts, len, plen, n: starts.length };
  return _cycle;
}
// returns {cd, phase, predicted} or null
function cycleOf(s) {
  const ci = cycleInfo();
  if (!ci.starts.length) return null;
  let last = null;
  for (const st of ci.starts) { if (st <= s) last = st; else break; }
  if (!last) return null;
  let diff = diffDays(last, s);
  let predicted = false;
  const t = todayS();
  if (s > t && diff >= ci.len) { diff = diff % ci.len; predicted = true; }
  const cd = diff + 1;
  const ov = ci.len - 14;
  let phase = cd <= ci.plen ? 'men' : (Math.abs(cd - ov) <= 1 ? 'ov' : (cd < ov ? 'fol' : 'lut'));
  if (s > t) predicted = true;
  return { cd, phase, predicted, len: ci.len };
}
const PHASES = { men: ['וסת', '#B85C7E'], fol: ['זקיקי', '#F3E7EA'], ov: ['ביוץ (משוער)', '#DCA7BA'], lut: ['לוטאלי', '#E6DDEE'] };

/* ---------- supplements ---------- */
// a supplement with no set time still gets one "לקחתי" button
function suppSlots(sp) { return sp.times && sp.times.length ? sp.times : ['לקחתי']; }
function suppDue(sp, s) {
  if (!sp.active) return false;
  if (sp.freq === 'daily') return true;
  if (sp.freq === 'alt') return ((diffDays(sp.anchor || s, s) % 2) + 2) % 2 === 0;
  if (sp.freq === 'days') return (sp.days || []).includes(parseD(s).getDay());
  if (sp.freq === 'weekly') {
    let cnt = 0; const ws = weekStart(s);
    for (let x = ws; x < s; x = addDays(x, 1)) if (suppSlots(sp).some(tm => getDay(x).supp[sp.id + '|' + tm])) cnt++;
    const takenToday = suppSlots(sp).some(tm => getDay(s).supp[sp.id + '|' + tm]);
    return cnt < (sp.n || 1) || takenToday;
  }
  return true;
}
function freqText(sp) {
  if (sp.freq === 'weekly') return (sp.n || 1) + ' פעמים בשבוע';
  if (sp.freq === 'days') return 'בימים ' + ((sp.days || []).length ? sp.days.slice().sort().map(i => DAY_LETTERS[i]).join(' ') : '—');
  return (FREQS.find(f => f[0] === sp.freq) || FREQS[0])[1];
}
function suppDayStats(s) {
  let due = 0, done = 0;
  DATA.supps.forEach(sp => {
    if (!suppDue(sp, s)) return;
    suppSlots(sp).forEach(tm => { due++; if (getDay(s).supp[sp.id + '|' + tm]) done++; });
  });
  return { due, done, pct: due ? Math.round(done / due * 100) : null };
}

/* ---------- daily metrics (used by calendar, charts, insights) ---------- */
let _metrics = {};
function metrics(s) {
  if (_metrics[s]) return _metrics[s];
  const d = getDay(s);
  const ents = d.entries.slice().sort((a, b) => a.t.localeCompare(b.t));
  const moods = ents.filter(e => e.kind === 'mood');
  const scores = moods.map(e => e.score).filter(Boolean);
  const famW = {};
  moods.forEach(e => (e.emos || []).forEach(w => { const f = famOfWord(w); if (f) famW[f.id] = (famW[f.id] || 0) + 1 + INTENSITY.indexOf(e.intensity || 'בינונית'); }));
  let dom = null, best = 0;
  Object.keys(famW).forEach(k => { if (famW[k] > best) { best = famW[k]; dom = k; } });
  const maxOf = (kind, f) => { const v = ents.filter(e => e.kind === kind).map(f).filter(x => x != null); return v.length ? Math.max(...v) : null; };
  const m = {
    has: ents.length > 0 || !!d.bleed || d.foods.length > 0 || !!d.feel || !!d.sleepH,
    hasEntries: ents.length > 0,
    mood: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null,
    moodSeq: scores,
    emo: dom, famW,
    energy: (() => { const v = ents.filter(e => e.kind === 'energy' || e.kind === 'mood').map(e => Number(e.energy)).filter(Boolean); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; })(),
    pain: maxOf('pain', e => e.pain),
    belly: maxOf('belly', e => SEVERITY.indexOf(e.sev) + 1),
    sym: maxOf('other', e => SEVERITY.indexOf(e.sev) + 1),
    stool: ents.filter(e => e.kind === 'stool').map(e => e.bristol),
    feel: d.feel || null,
    fit: workoutMin(s),
    practice: Math.round((d.sessions || []).reduce((a, z) => a + (z.dur || 0), 0) / 60),
    practiceN: (d.sessions || []).length,
    supp: suppDayStats(s).pct,
    bleed: d.bleed,
    sleep: d.sleepH ? SLEEP_H_NUM[SLEEP_H.indexOf(d.sleepH)] : null,
    cats: (() => { const set = new Set(); d.foods.forEach(f => ((DATA.foodLib[f.name] || {}).cats || []).forEach(c => set.add(c))); return set; })(),
    foodsLogged: d.foods.length > 0
  };
  _metrics[s] = m;
  return m;
}

/* ---------- small helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function lum(hex) {
  const h = hex.replace('#', ''); const v = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2];
}
function fgFor(bg) { const L = lum(bg); return (1.05 / (L + .05)) >= ((L + .05) / (lum(DARK) + .05)) ? WHITE : DARK; }

function download(name, text) {

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

  if (/שמן|מטוגן|טוגנ|מוקפץ|מוקפצ|מוקפצים|קלוי|צלוי|פסטו|ויניגרט|רוטב|ממרח|מיונז|טחינה|חמאה|שמנת|אבוקדו|גוואקמולי|זיתים|אגוז|שקדים|קשיו|פיסטוק|בוטנים|גרעינים|פשתן|צ׳יה|שומשום|מאפה|בורקס|עוג|קרואסון|שקשוקה|חביתה|תבשיל|מג׳דרה|ג׳חנון|מלאווח|קציצ/.test(n) || set.has('fried')) { set.add('oil'); hit = true; }
  // pasta / bread made from non-wheat flour is not gluten
  if (/ללא גלוטן|נטול גלוטן|קמח (עדשים|חומוס|אורז|כוסמת|תירס|אפונה|שעועית|קינואה)|פסטת (עדשים|חומוס|אורז)|פסטה (מעדשים|מחומוס|מאורז|מקמח עדשים|מקמח חומוס)/.test(n)) {
    set.delete('gluten'); if (/עדשים|חומוס|אפונה|שעועית/.test(n)) set.add('legumes'); set.add('carbs');
  }
  // plant milk is not dairy (unless the name also has cheese, yogurt etc.)
  if (/חלב (סויה|שקדים|שיבולת|אורז|קוקוס|צמחי|אגוזים)/.test(n) && !/גבינ|יוגורט|שמנת|חמאה|פטה|מוצרלה|קוטג|לבנ/.test(n)) set.delete('dairy');
  return { cats: [...set], guessed: hit && set.size > 0 };
}

/* ---------- tool images: kept on this phone in IndexedDB (not in the code, not public) ---------- */
const IMG = (() => {
  let dbp = null; const mem = {};
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('tracker-images', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  }));
  const tx = (mode, fn) => db().then(d => new Promise((res, rej) => { const t = d.transaction('img', mode); const s = t.objectStore('img'); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }));
  return {
    get: id => mem[id] ? Promise.resolve(mem[id]) : tx('readonly', s => s.get(id)).then(v => { if (v) mem[id] = v; return v; }).catch(() => null),
    put: (id, url) => { mem[id] = url; return tx('readwrite', s => s.put(url, id)); },
    del: id => { delete mem[id]; return tx('readwrite', s => s.delete(id)).catch(() => {}); },
    all: () => tx('readonly', s => s.getAllKeys()).then(keys => Promise.all((keys || []).map(k => IMG.get(k).then(v => [k, v])))).then(Object.fromEntries).catch(() => ({}))
  };
})();
// shrink a picked photo so it stays small (longest side 1100px, JPEG)
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, 1100 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

function fmtClock(sec) { return Math.floor(sec / 60) + ':' + pad(Math.floor(sec % 60)); }

}

/* ---------- suggestion after a hard entry ---------- */
function suggestFor(entry) {
  let focus = null, level = null;
  if (entry.kind === 'pain' && entry.pain >= 6) { focus = 'כאב'; level = entry.pain; }
  else if (entry.kind === 'belly' && SEVERITY.indexOf(entry.sev) >= 2) { focus = 'בטן'; }
  else if (entry.kind === 'mood') {
    const fams = new Set((entry.emos || []).map(w => (famOfWord(w) || {}).id));
    if ((entry.emos || []).includes('שיתוק ניהולי')) focus = 'תקיעות';
    else if (fams.has('self')) focus = 'ביקורת עצמית';
    else if (fams.has('stress')) focus = (entry.emos || []).includes('חרדה') ? 'חרדה' : 'סטרס';
    else if (fams.has('sad') || fams.has('low')) focus = 'עצב / דכדוך';
    else if (fams.has('anger')) focus = 'סטרס';
    else if (entry.score && entry.score <= 2) focus = 'כללי';
  }
  if (!focus) return null;
  ensureTools();
  const tools = DATA.tools.filter(x => (x.focus || []).includes(focus));
  return tools.length ? { focus, level, tools: tools.slice(0, 4).map(x => x.id) } : null;
}

}

function runPmr() {

  toolStart: a => startSession(a),

    z.g.text = ''; z.g.grat = ['', '', ''];

  },

  suggestGo: a => startSession(a, S.suggest.focus, S.suggest.level),
  suggestOff: () => { S.suggest = null; render(); },

S.range = 30;
function lineChart(pts, yMin, yMax, color, ticks, unit) {
  const W = 340, H = 150, l = 26, r = 8, t = 10, b = 22;
  const n = pts.length, x = i => l + (n === 1 ? 0 : i * (W - l - r) / (n - 1)), y = v => t + (1 - (v - yMin) / (yMax - yMin)) * (H - t - b);
  let path = '', pen = false;
  pts.forEach((p, i) => { if (p.v == null) { pen = false; return; } path += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); pen = true; });
  const grid = ticks.map(v => `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="#E8DFD1" stroke-width="1"/><text x="${l - 6}" y="${y(v) + 4}" font-size="10" fill="#6E6475" text-anchor="end">${v}</text>`).join('');
  const lab = [0, Math.floor((n - 1) / 2), n - 1].map(i => `<text x="${x(i)}" y="${H - 6}" font-size="10" fill="#6E6475" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${fmtShort(pts[i].s)}</text>`).join('');
  const dots = pts.map((p, i) => p.v == null ? '' : `<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="${color}" stroke="#fff" stroke-width="1.5"/>
    <circle cx="${x(i)}" cy="${y(p.v)}" r="11" fill="transparent" data-tip="${fmtShort(p.s)} · ${fmt1(p.v)}${unit}"/>`).join('');
  return `<div class="chart" style="position:relative" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img">${grid}${lab}<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg></div>`;
}
function barChart(vals, yMax, color, ticks, labelFn, tipFn) {
  const W = 340, H = 150, l = 26, r = 8, t = 10, b = 22;
  const n = vals.length, bw = (W - l - r) / n, y = v => t + (1 - v / yMax) * (H - t - b);
  const grid = ticks.map(v => `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="#E8DFD1"/><text x="${l - 6}" y="${y(v) + 4}" font-size="10" fill="#6E6475" text-anchor="end">${v}</text>`).join('');
  const bars = vals.map((v, i) => {
    const bx = l + i * bw + 1, w = Math.max(1, bw - 2);
    const lbl = labelFn(i) ? `<text x="${bx + w / 2}" y="${H - 6}" font-size="10" fill="#6E6475" text-anchor="middle">${labelFn(i)}</text>` : '';
    if (v == null) return lbl;
    const top = y(v), h = Math.max(0, y(0) - top);
    return `<path d="M${bx} ${y(0)} V${top + Math.min(4, h)} Q${bx} ${top} ${bx + Math.min(4, w / 2)} ${top} H${bx + w - Math.min(4, w / 2)} Q${bx + w} ${top} ${bx + w} ${top + Math.min(4, h)} V${y(0)} Z" fill="${color}"/>
      <rect x="${bx}" y="${t}" width="${w}" height="${H - t - b}" fill="transparent" data-tip="${tipFn(i, v)}"/>${lbl}`;
  }).join('');
  return `<div class="chart" style="position:relative" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img">${grid}<line x1="${l}" x2="${W - r}" y1="${y(0)}" y2="${y(0)}" stroke="#C9BBA6"/>${bars}</svg></div>`;
}

function renderInsights() {
  const t = todayS();
  const all = []; for (let i = 0; i < 180; i++) all.push(addDays(t, -i));
  const logged = all.filter(s => metrics(s).hasEntries);
  const need = 14;
  let html = `<div style="padding-top:18px"><h1>תובנות</h1><div class="small muted" style="margin-top:4px">דפוסים שחוזרים בנתונים שלך. אלה מתאמים, לא הוכחה לסיבה.</div></div>`;

    html += `<div class="card"><div style="font-weight:700">אוספים נתונים</div><div class="small muted" style="margin:4px 0 10px">התובנות יופיעו אחרי ${need} ימים עם רשומות. כרגע: ${logged.length}.</div><div class="bar"><div style="width:${logged.length / need * 100}%;background:var(--accent)"></div></div></div>`;
  }
  // --- cycle phases
  const ci = cycleInfo();
  if (ci.n >= 1) {
    const ph = { men: [], fol: [], ov: [], lut: [] };

    const row = (k, f) => { const v = ph[k].map(f).filter(x => x != null); return v.length ? fmt1(avg(v)) : '—'; };
    html += `<section class="card"><h2>לפי שלב במחזור</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">

      ${Object.keys(ph).map(k => `<tr style="border-top:1px solid var(--line2)"><td style="padding:8px 4px"><span class="row" style="gap:6px"><span class="sw" style="background:${PHASES[k][1]}"></span>${PHASES[k][0]}</span></td><td style="text-align:center">${ph[k].length}</td>
        <td style="text-align:center">${row(k, m => m.pain != null ? m.pain : 0)}</td><td style="text-align:center">${row(k, m => m.mood)}</td><td style="text-align:center">${row(k, m => m.belly || 0)}</td></tr>`).join('')}
      </tbody></table></div><div class="xs muted" style="margin-top:6px">כאב 0–10 (מקסימום יומי), מצב רוח 1–5, בטן 0–4. מבוסס על ${ci.n} מחזורים שתועדו.</div></section>`;
  }

  const foodFindings = foodInsights(all);

      <div class="xs muted" style="margin-top:10px">נבדקים הרבה צירופים של מזון ותסמין, ולכן חלק מהדפוסים יכולים לצוץ במקרה. מוצגים רק הבדלים גדולים שמבוססים על לפחות 4 ימים בכל צד.</div></section>`;
  }
  // --- supplements adherence
  const last14 = all.slice(0, 14).filter(s => DATA.days[s]);
  if (last14.length) {
    html += `<section class="card"><h2>עמידה ביעדי תוספים</h2><div class="xs muted" style="margin-bottom:6px">14 הימים האחרונים שבהם פתחת את היומן</div>
      ${DATA.supps.filter(sp => sp.active).map(sp => { let due = 0, done = 0; last14.forEach(s => { if (!suppDue(sp, s)) return; suppSlots(sp).forEach(tm => { due++; if (getDay(s).supp[sp.id + '|' + tm]) done++; }); }); const p = due ? Math.round(done / due * 100) : 0;
        return `<div class="row" style="margin:8px 0"><span class="small" style="width:110px;flex:0 0 auto">${esc(sp.name)}</span><div class="bar" style="flex:1"><div style="width:${p}%"></div></div><b class="small" style="width:40px;text-align:left">${due ? p + '%' : '—'}</b></div>`; }).join('')}</section>`;

function foodInsights(days) {
  const outcomes = [
    ['belly', 'תסמיני בטן', s => { const m = metrics(s); return m.hasEntries ? (m.belly || 0) : null; }, 'עוצמה ממוצעת', 4],
    ['pain', 'כאב', s => { const m = metrics(s); return m.hasEntries ? (m.pain || 0) : null; }, 'כאב מקסימלי ממוצע', 10],
    ['mood', 'מצב רוח', s => metrics(s).mood, 'ציון ממוצע', 5],
    ['lowsad', 'ימי עצב או דכדוך', s => { const m = metrics(s); return m.moodSeq.length ? ((m.famW.low || m.famW.sad || m.famW.self) ? 1 : 0) : null; }, 'שיעור הימים', 1],
    ['baddream', 'חלומות רעים', s => { const d = getDay(s); return d.dream ? (d.dream === 'חלומות רעים' ? 1 : 0) : null; }, 'שיעור הימים', 1],
    ['stool', 'יציאות לא תקינות', s => { const m = metrics(s); return m.hasEntries ? (m.stool.some(b => b <= 2 || b >= 6) ? 1 : 0) : null; }, 'שיעור הימים', 1]
  ];
  const groups = FOOD_CATS.map(c => [c[0], c[1], s => metrics(s).cats.has(c[0])])
    .concat([['bought', 'אוכל קנוי', s => getDay(s).foods.some(f => f.prep === 'קנוי')], ['out', 'אוכל בחוץ', s => getDay(s).foods.some(f => f.prep === 'בחוץ / מסעדה')]]);
  const foodDays = days.filter(s => metrics(s).foodsLogged);
  const res = [];
  groups.forEach(([gid, gname, has]) => {
    [0, 1].forEach(lag => outcomes.forEach(([oid, oname, val, unit, scale]) => {
      const w = [], wo = [];
      foodDays.forEach(s => { const v = val(addDays(s, lag)); if (v == null) return; (has(s) ? w : wo).push(v); });
      if (w.length < 4 || wo.length < 4) return;
      const mw = avg(w), mo = avg(wo);
      const sd = Math.sqrt((w.reduce((a, x) => a + (x - mw) ** 2, 0) + wo.reduce((a, x) => a + (x - mo) ** 2, 0)) / Math.max(1, w.length + wo.length - 2));
      const eff = (mw - mo) / Math.max(sd, scale * 0.08);
      if (Math.abs(eff) < 0.6) return;
      const pct = scale === 1;
      const f = x => pct ? Math.round(x * 100) + '%' : fmt1(x);
      const dir = oid === 'mood' ? (mw > mo ? 'גבוה יותר' : 'נמוך יותר') : (mw > mo ? 'יותר' : 'פחות');
      res.push({
        score: Math.abs(eff) * Math.min(1, Math.sqrt(Math.min(w.length, wo.length) / 8)),
        title: `${gname} ← ${oname} ${dir} ${lag ? '(יום אחרי)' : ''}`.trim(),
        text: `${gname === 'אוכל קנוי' || gname === 'אוכל בחוץ' ? 'בימים עם ' + gname : 'בימים שאכלת ' + gname}: ${unit} ${f(mw)}${lag ? ' ביום שאחרי' : ''}, לעומת ${f(mo)} אחרי שאר הימים`.replace(' אחרי שאר', lag ? ' אחרי שאר' : ' בשאר') + '.',
        n: `${w.length} ימים מול ${wo.length}`
      });
    }));
  });
  return res.sort((a, b) => b.score - a.score).slice(0, 8);
}

        <div class="lbl">תדירות</div><div class="wrap">${FREQS.map(f => chip(f[1], sp.freq === f[0], 'suppFreq', sp.id + '::' + f[0])).join('')}</div>
        ${sp.freq === 'weekly' ? `<div class="lbl">כמה פעמים בשבוע?</div><div class="scale" style="grid-template-columns:repeat(6,minmax(0,1fr))">${[1, 2, 3, 4, 5, 6].map(n => `<button aria-pressed="${sp.n === n}" style="background:#fff;border:1px solid var(--chipline)" data-act="suppN" data-a="${sp.id}::${n}">${n}</button>`).join('')}</div>` : ''}
        ${sp.freq === 'days' ? `<div class="lbl">באילו ימים?</div><div class="grid7">${DAY_LETTERS.map((l, i) => chip(l, (sp.days || []).includes(i), 'suppDay', sp.id + '::' + i)).join('')}</div>` : ''}
        ${sp.freq === 'alt' ? `<div class="xs muted" style="margin-top:6px">מתחיל מהיום שבו נבחרה התדירות.</div>` : ''}
        <div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" data-act="suppActive" data-a="${sp.id}">${sp.active ? 'השהיה' : 'הפעלה מחדש'}</button><button class="btn ghost" style="color:#A3324A" data-act="suppDel" data-a="${sp.id}">מחיקה</button></div>
      </div>` : ''}
    </div>`;
  }).join('');
  const lib = Object.keys(DATA.foodLib).sort((a, b) => a.localeCompare(b, 'he'));
  $view.innerHTML = `
    <div style="padding-top:18px"><h1>הגדרות</h1></div>
    <section class="card"><h2>תוספים ויעדים</h2>${sup}<button class="btn soft block" style="margin-top:10px" data-act="suppAdd">+ הוספת תוסף</button></section>
    <section class="card"><details ${S.libOpen ? 'open' : ''} data-act="libToggle"><summary class="between"><h2 style="margin:0">ספריית המאכלים שלי</h2><span class="small muted">${lib.length} פריטים</span></summary>
      <div class="xs muted" style="margin:6px 0">הקבוצות של כל מאכל משמשות לזיהוי דפוסים. אפשר לתקן כאן בכל רגע.</div>
      ${lib.map(n => `<div style="padding:10px 0;border-top:1px solid var(--line2)"><div class="between"><b>${esc(n)}</b><button class="iconbtn" style="width:36px;height:36px;color:var(--muted)" aria-label="מחיקת ${esc(n)} מהספרייה" data-act="libDel" data-a="${esc(n)}">${ICON.x}</button></div>
        <div class="wrap" style="margin-top:6px">${FOOD_CATS.map(c => `<button type="button" class="chip" style="min-height:34px;font-size:13px;padding:0 10px" aria-pressed="${DATA.foodLib[n].cats.includes(c[0])}" data-act="libCat" data-a="${esc(n)}::${c[0]}">${c[1]}</button>`).join('')}</div></div>`).join('') || '<div class="small muted">עוד אין מאכלים. הם יתווספו כאן כשתזיני אוכל.</div>'}
    </details></section>
    <section class="card"><h2>מחזור</h2><label class="small muted" for="cycLen">אורך מחזור משוער (עד שיצטברו נתונים)</label>
      <div class="row" style="margin-top:6px"><input id="cycLen" class="input" style="width:100px" type="number" min="18" max="50" value="${DATA.settings.cycleLen || 28}" data-input="cycLen"><span class="small muted">ימים · מחושב בפועל: ${cycleInfo().n >= 2 ? cycleInfo().len + ' ימים' : 'עוד אין מספיק מחזורים'}</span></div></section>
    <section class="card"><h2>גיבוי וייצוא</h2>
      <div class="small muted" style="margin-bottom:10px">${last ? 'גיבוי אחרון: ' + fmtShort(last) + '.' + last.slice(0, 4) : 'עוד לא גיבית. הנתונים נשמרים רק בטלפון הזה.'}</div>
      <button class="btn block" data-act="export">ייצוא נתונים (גיבוי + ניתוח עם Claude)</button>
      <label class="btn ghost block" style="display:flex;align-items:center;justify-content:center;margin-top:8px">שחזור מגיבוי<input type="file" accept="application/json,.json" style="display:none" data-change="import"></label>
      <div class="xs muted" style="margin-top:8px">קובץ הייצוא כולל גם את יומן האימונים מ-Workout Pro, כדי שהניתוח יראה את התמונה המלאה. השחזור מחליף רק את נתוני היומן הזה.</div></section>
    <div class="xs muted" style="text-align:center;margin-top:16px">יומן בריאות · גרסה ${APP_VERSION} · כל הנתונים נשמרים על המכשיר בלבד</div>`;
}

/* =====================================================================
   Actions & events
   ===================================================================== */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab && !S.day ? 'page' : 'false'));
  if (S.day) renderDay();
  else if (S.tab === 'cal') renderCal();
  else if (S.tab === 'charts') renderCharts();
  else if (S.tab === 'insights') renderInsights();
  else if (S.tab === 'tools') renderTools();
  else renderSettings();
}
const split2 = a => { const i = a.indexOf('::'); return [a.slice(0, i), a.slice(i + 2)]; };
const toggleIn = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); else arr.push(x); };
function supp(id) { return DATA.supps.find(s => s.id === id); }

function addFoodName(name) {
  name = (name || '').trim().replace(/\s+/g, ' ');
  if (!name) return;
  const d = editDay(S.day);
  d.foods.push({ name, slot: S.slot, prep: S.prep });
  if (!DATA.foodLib[name]) {
    const g = guessFoodCats(name);
    DATA.foodLib[name] = { cats: g.cats, confirmed: false };
    S.pending = { name, cats: g.cats.slice(), guessed: g.guessed };
  }
  save();
}

const ACT = {
  tab: a => { closeSheet(); S.day = null; S.tab = a; if (history.state && history.state.v) history.replaceState(null, ''); render(); window.scrollTo(0, 0); },
  goToday: () => { S.month = todayS().slice(0, 7); S.sel = todayS(); render(); },
  month: a => { const [y, m] = S.month.split('-').map(Number); const d = new Date(y, m - 1 + Number(a), 1); S.month = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); },
  layer: a => { S.layer = a; render(); },
  moodMode: a => { S.moodMode = a; render(); },
  selDay: a => { if (S.sel === a) return ACT.openDay(a); S.sel = a; render(); },
  openDay: a => { S.openSec = {}; S.day = a; S.sel = a; S.pending = null; history.pushState({ v: 'day' }, ''); render(); window.scrollTo(0, 0); },
  back: () => { if (history.state && history.state.v === 'day') history.back(); else { S.day = null; render(); } },
  dayNav: a => { S.foodDraft = ''; S.suppEdit = null; S.openSec = {}; S.day = addDays(S.day, Number(a)); S.sel = S.day; S.month = S.day.slice(0, 7); S.pending = null; render(); },
  bleed: a => { editDay(S.day).bleed = a === 'אין' ? 'אין' : a; save(); render(); },
  extra: a => { toggleIn(editDay(S.day).extras, a); save(); render(); },
  sleepH: a => { const d = editDay(S.day); d.sleepH = d.sleepH === a ? '' : a; save(); render(); },
  sleepQ: a => { const d = editDay(S.day); d.sleepQ = d.sleepQ === a ? '' : a; save(); render(); },
  dream: a => { const d = editDay(S.day); d.dream = d.dream === a ? '' : a; save(); render(); },
  // first tap: mark as taken now (today) or open the time editor (another day); tap a taken one: edit time / undo
  supp: a => {
    const d = editDay(S.day);
    if (d.supp[a]) { S.suppEdit = S.suppEdit === a ? null : a; render(); return; }
    if (S.day === todayS()) { d.supp[a] = nowHM(); S.suppEdit = null; }
    else { d.supp[a] = true; S.suppEdit = a; }
    save(); render();
  },
  suppUntake: a => { delete editDay(S.day).supp[a]; S.suppEdit = null; save(); render(); },
  suppEditDone: () => { S.suppEdit = null; render(); },
  slot: a => { S.slot = a; render(); },
  prep: a => { S.prep = a; render(); },
  addFood: () => { const el = document.getElementById('foodIn'); addFoodName(el && el.value); S.foodDraft = ''; render(); const n = document.getElementById('foodIn'); if (n && !S.pending) n.focus(); },
  quickFood: a => { addFoodName(a); render(); },
  rmFood: a => { editDay(S.day).foods.splice(Number(a), 1); save(); render(); },
  pcat: a => { toggleIn(S.pending.cats, a); render(); },
  confirmFood: () => { DATA.foodLib[S.pending.name] = { cats: S.pending.cats.slice(), confirmed: true }; S.pending = null; save(); render(); toast('נשמר בספריית המאכלים'); },
  skipFood: () => { S.pending = null; render(); },
  crave: a => { toggleIn(editDay(S.day).craves, a); save(); render(); },
  feel: a => { const d = editDay(S.day); d.feel = d.feel === Number(a) ? 0 : Number(a); save(); render(); },
  sec: a => { S.openSec[a] = !S.openSec[a]; render(); },
  newEntry: a => { S.comp = newComp(a || 'mood'); history.pushState({ v: 'sheet' }, ''); openSheet(); },
  editEntry: a => { const e = getDay(S.day).entries.find(x => x.id === a); if (!e) return; S.comp = Object.assign(newComp(e.kind), JSON.parse(JSON.stringify(e))); history.pushState({ v: 'sheet' }, ''); openSheet(); },
  cKind: a => { S.comp.kind = a; S.comp.syms = []; S.comp.when = []; S.comp.help = []; renderSheet(); },
  cToggle: a => { const [f, v] = split2(a); toggleIn(S.comp[f], v); renderSheet(); },
  cSet: a => { const [f, v] = split2(a); S.comp[f] = v; renderSheet(); },
  cNum: a => { const [f, v] = split2(a); S.comp[f] = (f === 'score' && S.comp.score === Number(v)) ? null : Number(v); renderSheet(); },
  cSave: () => {
    const c = S.comp;
    if ((c.kind === 'belly' || c.kind === 'other') && !c.syms.length) { toast('בחרי לפחות תסמין אחד'); return; }
    if (c.kind === 'energy' && !c.energy) { toast('בחרי רמת אנרגיה'); return; }
    if (c.kind === 'mood' && !c.emos.length && !c.score) { toast('בחרי רגש או מצב רוח כללי'); return; }
    S.openSec[c.kind] = true;
    const d = editDay(S.day); const e = compToEntry(c);
    const i = d.entries.findIndex(x => x.id === e.id);
    if (i >= 0) d.entries[i] = e; else { d.entries.push(e); S.suggest = suggestFor(e); }
    save(); ACT.cClose(); render();
    if (S.suggest && S.day === todayS()) window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  cDelete: () => { if (!confirm('למחוק את הרשומה?')) return; const d = editDay(S.day); d.entries = d.entries.filter(x => x.id !== S.comp.id); save(); ACT.cClose(); render(); },
  cClose: () => { if (history.state && history.state.v === 'sheet') history.back(); else closeSheet(); },
  range: a => { S.range = Number(a); render(); },
  export: () => IMG.all().then(images => {
    let wl = []; try { wl = JSON.parse(localStorage.getItem(WORKOUT_KEY) || '[]'); } catch (e) {}
    const out = { app: 'tracker', version: 1, exportedAt: new Date().toISOString(), data: DATA, workoutLog: wl, images,
      legend: { suppTaken: 'supplement value = HH:MM when taken, or true if no time', scales: 'mood score 1-5 (overall mood, optional), energy 1-5 (separate energy entries; older mood entries may also carry energy), pain 0-10, severity קלה<בינונית<חזקה<קשה, bristol 1-7', foodCats: Object.fromEntries(FOOD_CATS) } };
    download('tracker-' + todayS() + '.json', JSON.stringify(out, null, 1));
    try { localStorage.setItem('tracker.lastBackup', todayS()); } catch (e) {}
    if (S.tab === 'settings' && !S.day) setTimeout(render, 300);
  }),
  imgZoom: () => {
    const src = (document.querySelector('#sheetPanel img[data-act="imgZoom"]') || {}).src; if (!src) return;
    const o = document.createElement('div'); o.style.cssText = 'position:fixed;inset:0;z-index:80;background:rgba(20,16,24,.92);display:flex;align-items:center;justify-content:center;padding:12px';
    o.innerHTML = '<img alt="" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:8px">'; o.firstChild.src = src;
    o.addEventListener('click', () => o.remove()); document.body.appendChild(o);
  },
  suppOpen: a => { S.suppOpen = S.suppOpen === a ? null : a; render(); },
  suppTime: a => { const [id, v] = split2(a); toggleIn(supp(id).times, v); supp(id).times.sort((x, y) => SUPP_TIMES.indexOf(x) - SUPP_TIMES.indexOf(y)); save(); render(); },
  suppFreq: a => { const [id, v] = split2(a); const sp = supp(id); sp.freq = v; if (v === 'alt') sp.anchor = todayS(); if (v === 'weekly' && !(sp.n < 7)) sp.n = 3; save(); render(); },
  suppN: a => { const [id, v] = split2(a); supp(id).n = Number(v); save(); render(); },
  suppDay: a => { const [id, v] = split2(a); const sp = supp(id); sp.days = sp.days || []; toggleIn(sp.days, Number(v)); save(); render(); },
  suppActive: a => { supp(a).active = !supp(a).active; save(); render(); },
  suppDel: a => { if (!confirm('למחוק את "' + supp(a).name + '"? הסימונים הקודמים יישארו בנתונים.')) return; DATA.supps = DATA.supps.filter(s => s.id !== a); S.suppOpen = null; save(); render(); },
  suppAdd: () => { const id = uid(); DATA.supps.push({ id, name: 'תוסף חדש', dose: '', times: ['בוקר'], freq: 'daily', n: 7, days: [], anchor: todayS(), active: true }); S.suppOpen = id; save(); render(); setTimeout(() => { const el = document.getElementById('sn-' + id); if (el) { el.focus(); el.select(); } }, 50); },
  libToggle: () => {},
  libCat: a => { const [n, c] = split2(a); toggleIn(DATA.foodLib[n].cats, c); DATA.foodLib[n].confirmed = true; save(); S.libOpen = true; render(); },
  libToggle2: () => {},
  libDel: a => { if (!confirm('למחוק את "' + a + '" מהספרייה? בפעם הבאה שתזיני אותו תתבקשי לסמן קבוצות מחדש.')) return; delete DATA.foodLib[a]; save(); S.libOpen = true; render(); }
};
Object.assign(ACT, ACT_EXTRA);
document.addEventListener('click', e => {
  const tab = e.target.closest('#tabs button');
  if (tab) { ACT.tab(tab.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'DETAILS') return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.a); }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-act="libToggle"]')) S.libOpen = e.target.open; }, true);
$sheet.addEventListener('click', e => { if (e.target !== $sheet) return; if (S.sess && S.sess.step === 'run') return; if (S.sess || S.toolEd) ACT.sheetClose(); else ACT.cClose(); });
let noteTimer = null;
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'cTime') S.comp.t = el.value;
  else if (k === 'cNote') S.comp.note = el.value;
  else if (k === 'cTemp') S.comp.temp = el.value;
  else if (k === 'foodDraft') S.foodDraft = el.value;
  else if (k === 'tName') S.toolEd.name = el.value;
  else if (k === 'tUrl') S.toolEd.url = el.value.trim();
  else if (k === 'tText') S.toolEd.text = el.value;
  else if (k === 'sNote') S.sess.note = el.value;
  else if (k === 'gText') S.sess.g.text = el.value;
  else if (k === 'gTask') S.sess.g.task = el.value;
  else if (k === 'gStep') S.sess.g.step = el.value;
  else if (k === 'gGrat') S.sess.g.grat[Number(el.dataset.a)] = el.value;
  else if (k === 'suppAt') { const d = editDay(S.day); d.supp[el.dataset.a] = el.value || true; save(); }
  else if (k === 'dayNote') { clearTimeout(noteTimer); const s = S.day; noteTimer = setTimeout(() => { editDay(s).note = el.value; save(); }, 400); }
  else if (k === 'suppName') { supp(el.dataset.a).name = el.value; save(); }
  else if (k === 'suppDose') { supp(el.dataset.a).dose = el.value; save(); }
  else if (k === 'cycLen') { const v = Number(el.value); if (v >= 18 && v <= 50) { DATA.settings.cycleLen = v; save(); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); ACT[e.target.dataset.enter](); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'tUrl' && S.toolEd) { renderToolEditor(); return; }
  if (e.target.dataset && e.target.dataset.change === 'toolImg') {
    const f = e.target.files && e.target.files[0]; if (!f || !S.toolEd) return;
    shrinkImage(f).then(u => { S.toolEd._img = u; S.toolEd._imgDel = false; renderToolEditor(); }).catch(() => toast('לא הצלחתי לפתוח את התמונה'));
    return;
  }
  if (e.target.dataset && e.target.dataset.change === 'import') {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(r.result);
        if (!obj || obj.app !== 'tracker' || !obj.data || !obj.data.days) throw new Error('bad');
        if (!confirm('לשחזר מהגיבוי? הנתונים הנוכחיים ביומן יוחלפו בנתוני הגיבוי. (יומן האימונים לא ישתנה.)')) return;
        localStorage.setItem(KEY, JSON.stringify(obj.data)); load(); invalidate();
        Promise.all(Object.entries(obj.images || {}).map(([k, v]) => v ? IMG.put(k, v) : null)).then(() => { render(); toast('השחזור הצליח'); });
      } catch (err) { alert('הקובץ לא נראה כמו גיבוי של היומן'); }
      e.target.value = '';
    };
    r.readAsText(file);
  }
});
window.addEventListener('popstate', () => {
  if ($sheet.classList.contains('open')) { closeSheet(); return; }
  if (S.day) { flushNote(); S.day = null; S.pending = null; render(); }
});
function flushNote() { const el = document.getElementById('dayNote'); if (el && S.day && el.value !== getDay(S.day).note) { clearTimeout(noteTimer); editDay(S.day).note = el.value; save(); } }
window.addEventListener('pagehide', flushNote);
// another app (Workout Pro) may have written new workouts — refresh when we come back
document.addEventListener('visibilitychange', () => { if (!document.hidden) { invalidate(); if (!$sheet.classList.contains('open') && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render(); } });

/* ---------------- init ---------------- */
load();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('tracker-sw.js').catch(() => {});
</script>
</body>
</html>
